name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # This repo consumes Nexus.ProductCore.Contracts from GitHub Packages
    # (nuget.config -> github-prtcare feed), so the restore step needs the
    # private-feed credentials. They come from repo secrets only - never inline.
    env:
      # nuget.config reads these two env vars (as %GITHUB_PACKAGES_USERNAME% /
      # %GITHUB_PACKAGES_TOKEN%). They're sourced from the canonical
      # GITHUB_PACKAGES_* secret names as used on Nexus.Intelligence and
      # Nexus.Experience, with the shorter PACKAGES_* variants as a fallback.
      # A missing secret evaluates to an empty string, so either set resolves;
      # neither set -> empty creds -> restore 401s from nuget.pkg.github.com.
      GITHUB_PACKAGES_USERNAME: ${{ secrets.GITHUB_PACKAGES_USERNAME || secrets.PACKAGES_USERNAME }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN || secrets.PACKAGES_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SDK version is read from global.json (10.0.302) rather than hardcoded
      # here, so the pipeline stays in sync with the repo's pinned SDK.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # nuget.config pins the feed list (<clear/> then nuget.org + github-prtcare
      # + local) and reads %GITHUB_PACKAGES_USERNAME% / %GITHUB_PACKAGES_TOKEN%
      # from the job env above. The `local` source is a dev-machine folder path
      # that doesn't exist on the runner; NuGet skips a missing folder source, so
      # it's harmless here. The private Nexus.ProductCore.Contracts package can
      # only be resolved from github-prtcare, hence the credentials.
      - name: Restore
        run: dotnet restore Nexus.Developer.slnx

      - name: Build
        run: dotnet build Nexus.Developer.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Nexus.Developer.slnx -c Release --no-build --logger trx --results-directory ./artifacts/test-results

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ github.workspace }}/artifacts/test-results
          if-no-files-found: warn
